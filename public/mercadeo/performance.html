<style>
/* ===========================================================================
   Puerta Abierta — Performance Dashboard
   Design language: "drafting table". Cool slate paper, hairline rules, navy
   ink from the wordmark, brass as the only accent. Everything numeric is set
   in a mono face with tabular figures so columns align like a unit schedule.
   =========================================================================== */

:root {
  --ink: #101b33;
  --ink-2: #2b3a58;
  --ink-3: #5c6a85;
  --ink-4: #8b96a9;
  --paper: #e9edf2;
  --card: #ffffff;
  --rule: #d0d8e3;
  --rule-2: #e3e9f0;
  --brass: #a97e35;
  --brass-soft: #f0e5d0;

  --s1: #101b33;
  --s2: #5e7192;
  --s3: #a97e35;
  --s4: #43786c;
  --s5: #a8574a;
  --s6: #9aa3b4;

  --pos: #2f6b58;
  --neg: #a8433a;

  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Archivo", "Helvetica Neue", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --rail: 208px;
  --gap: 14px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

body { min-height: 100vh; }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- shell --- */

.shell { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }

.rail {
  background: var(--ink);
  color: #fff;
  padding: 20px 0 24px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.brand { padding: 0 18px 18px; border-bottom: 1px solid rgba(255,255,255,.14); }
.brand .wm {
  font-weight: 800; font-size: 15px; letter-spacing: -.02em;
  text-transform: uppercase; line-height: 1.05;
}
.brand .wm span { display: block; font-weight: 400; font-size: 9.5px; letter-spacing: .34em; opacity: .62; margin-top: 5px; }

/* The gate: a hairline reduction of the wordmark's iron-gate motif. The only
   piece of ornament in the interface, and it doubles as the rail divider. */
.gate { display: block; width: 100%; height: 34px; margin: 14px 0 4px; opacity: .55; }

.nav { margin-top: 10px; }
.nav button {
  display: block; width: 100%; text-align: left;
  background: none; border: 0; border-left: 2px solid transparent;
  color: rgba(255,255,255,.66);
  font-family: var(--sans); font-size: 11px; font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase;
  padding: 11px 18px 11px 16px; cursor: pointer;
  transition: color .12s, border-color .12s, background .12s;
}
.nav button:hover { color: #fff; background: rgba(255,255,255,.05); }
.nav button.on { color: #fff; border-left-color: var(--brass); background: rgba(169,126,53,.14); }
.nav button .idx { font-family: var(--mono); opacity: .45; margin-right: 9px; font-size: 10px; }
.nav button:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }

.railfoot {
  margin-top: auto; padding: 16px 18px 0; border-top: 1px solid rgba(255,255,255,.14);
  font-size: 10px; line-height: 1.55; color: rgba(255,255,255,.42);
  font-family: var(--mono);
}

/* ------------------------------------------------------------- controls --- */

.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  background: var(--card); border-bottom: 1px solid var(--rule);
  padding: 12px 20px; display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 20;
}

.ctl { min-width: 0; }
.ctl > label, .lbl {
  display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-4); margin-bottom: 6px;
}

.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip {
  font-family: var(--mono); font-size: 11px; padding: 4px 9px;
  border: 1px solid var(--rule); background: #fff; color: var(--ink-3);
  cursor: pointer; border-radius: 2px; white-space: nowrap;
  transition: all .12s;
}
.chip:hover { border-color: var(--ink-4); color: var(--ink); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip.on.brass { background: var(--brass); border-color: var(--brass); }
.chip:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

.range { display: flex; align-items: center; gap: 10px; }
.range input[type=range] { width: 128px; accent-color: var(--brass); }
.range .rv { font-family: var(--mono); font-size: 11.5px; color: var(--ink); min-width: 62px; }

select {
  font-family: var(--mono); font-size: 11.5px; padding: 4px 6px;
  border: 1px solid var(--rule); background: #fff; color: var(--ink); border-radius: 2px;
  max-width: 260px;
}

.xfbar {
  background: var(--brass-soft); border-bottom: 1px solid #e0cfae;
  padding: 7px 20px; font-size: 12px; display: none; align-items: center; gap: 12px;
}
.xfbar.on { display: flex; }
.xfbar b { font-family: var(--mono); font-weight: 600; }
.xfbar button {
  font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; background: var(--ink); color: #fff; border: 0;
  padding: 4px 9px; border-radius: 2px; cursor: pointer;
}

/* ----------------------------------------------------------------- page --- */

.page { padding: var(--gap) 20px 40px; }
.pagehead { display: flex; align-items: baseline; gap: 14px; margin: 4px 0 14px; }
.pagehead h1 {
  margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; text-transform: uppercase;
}
.pagehead .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-4); }

.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); }

.card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 2px;
  padding: 13px 15px 15px; min-width: 0;
}
.card > h3 {
  margin: 0 0 11px; font-size: 10px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-3);
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.card > h3 em { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--ink-4); letter-spacing: 0; }

/* KPI: no boxes, just a hairline and a survey tick — like a dimension line. */
.kpi { padding: 12px 15px 14px; }
.kpi .k-l { font-size: 9.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-4); }
.kpi .k-v { font-family: var(--mono); font-size: 25px; font-weight: 500; letter-spacing: -.03em; margin-top: 7px; line-height: 1; }
.kpi .k-s { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 6px; }
.kpi .tick { height: 1px; background: var(--rule); margin-top: 11px; position: relative; }
.kpi .tick::before, .kpi .tick::after {
  content: ""; position: absolute; top: -3px; width: 1px; height: 7px; background: var(--ink-4);
}
.kpi .tick::before { left: 0; }
.kpi .tick::after { right: 0; }
.kpi.accent .k-v { color: var(--brass); }

/* ---------------------------------------------------------------- table --- */

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th {
  text-align: left; font-size: 9.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-4);
  border-bottom: 1px solid var(--rule); padding: 0 8px 6px 0; white-space: nowrap;
}
th.n, td.n { text-align: right; padding-right: 0; }
td {
  padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: #f5f7fa; }
tr.clk { cursor: pointer; }
tr.sel td { background: var(--brass-soft) !important; }
.tw { overflow: auto; }
tfoot td { border-top: 1px solid var(--rule); border-bottom: 0; font-weight: 700; padding-top: 7px; }

/* ---------------------------------------------------------------- chart --- */

svg { display: block; width: 100%; overflow: visible; }
.ax { stroke: var(--rule); stroke-width: 1; shape-rendering: crispEdges; }
.gl { stroke: var(--rule-2); stroke-width: 1; shape-rendering: crispEdges; }
.tk { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-4); }
.vl { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
.hit { fill: transparent; cursor: pointer; }
.hit:hover + .mk, .hit:hover { opacity: 1; }
.dim { opacity: .22; }
.node { fill: #fff; stroke-width: 1.4; }

.legend { display: flex; gap: 13px; flex-wrap: wrap; margin-top: 9px; font-size: 10.5px; color: var(--ink-3); }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; }

.tip {
  position: fixed; pointer-events: none; z-index: 100; background: var(--ink); color: #fff;
  font-family: var(--mono); font-size: 11px; padding: 6px 9px; border-radius: 2px;
  opacity: 0; transition: opacity .09s; max-width: 300px; line-height: 1.5;
}
.tip.on { opacity: 1; }
.tip b { color: var(--brass-soft); font-weight: 500; }

.empty { padding: 26px 0; text-align: center; color: var(--ink-4); font-family: var(--mono); font-size: 11.5px; }

/* --------------------------------------------------------------- audit ---- */

.finding { border-left: 2px solid var(--rule); padding: 0 0 0 15px; margin-bottom: 20px; }
.finding.sev1 { border-left-color: var(--neg); }
.finding.sev2 { border-left-color: var(--brass); }
.finding h4 { margin: 0 0 5px; font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
.finding .sev {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-4); margin-bottom: 4px;
}
.finding p { margin: 0 0 7px; font-size: 12.5px; line-height: 1.62; color: var(--ink-2); max-width: 74ch; }
.finding code {
  font-family: var(--mono); font-size: 11.5px; background: #eef1f5;
  padding: 1px 4px; border-radius: 2px; color: var(--ink);
}
.finding .fix { font-size: 12.5px; line-height: 1.62; color: var(--ink-2); max-width: 74ch; }
.finding .fix b { font-weight: 700; }

/* -------------------------------------------------------------- spans ----- */
.c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; }
.c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; }
.c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }

@media (max-width: 1180px) {
  .c2, .c3, .c4 { grid-column: span 4; }
  .c5, .c6, .c7 { grid-column: span 6; }
  .c8, .c9 { grid-column: span 12; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: column; }
  .nav { display: flex; overflow-x: auto; }
  .nav button { white-space: nowrap; width: auto; border-left: 0; border-bottom: 2px solid transparent; }
  .nav button.on { border-left: 0; border-bottom-color: var(--brass); }
  .railfoot { display: none; }
  .gate { display: none; }
  [class*="c"] { grid-column: span 12 !important; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .c2, .c3 { grid-column: span 1 !important; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>

<script>
/* ===========================================================================
   Puerta Abierta — Performance Dashboard
   Rebuilt from Performance_Dashboard_-_Puerta_Abierta.pbix (model refreshed
   2026-08-04). Aggregates are reproduced from the VertiPaq tables, not
   re-derived from the source workbooks, so every figure ties back to the
   published report.
   =========================================================================== */

const D = window.__PA_DATA__;

/* ------------------------------------------------------------------ data -- */

const EPOCH = new Date(D.meta.epoch + "T00:00:00Z");
const dayToDate = (n) => new Date(EPOCH.getTime() + n * 86400000);
const MONTHS_ES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DOW_ES = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];

// daily: [dayIdx, accIdx, alcance, impresiones, leads, clics, spend, cplSum, cplN, frqSum, frqN]
const DAILY = D.daily.map((r) => {
  const dt = dayToDate(r[0]);
  return {
    day: r[0], dt, ym: dt.toISOString().slice(0, 7), dow: dt.getUTCDay(),
    acc: D.acc[r[1]],
    alc: r[2], imp: r[3], led: r[4], clk: r[5], spd: r[6],
    cplS: r[7], cplN: r[8], frqS: r[9], frqN: r[10],
  };
});

// camp: [ym, accIdx, cmpIdx, impresiones, leads, clics, spend]
const CAMP = D.camp.map((r) => ({
  ym: r[0], acc: D.acc[r[1]], cmp: D.cmp[r[2]],
  imp: r[3], led: r[4], clk: r[5], spd: r[6],
}));

/* One campaign in the source booked 104,290 leads against $323 of spend. The
   .pbix hides it behind a page-scoped filter on page 1 only; here it is a
   first-class toggle applied at the data layer, so the figure is consistent on
   every page. `exclDaily` carries that campaign's exact daily totals, which get
   subtracted rather than estimated. */
const EXCLUDED_CMP = D.exclCmp;
const EXCL_KEYS = new Map(
  D.exclDaily.map((r) => [r[0] + "|" + r[1],
    { alc: r[2], imp: r[3], led: r[4], clk: r[5], spd: r[6], cplS: r[7], cplN: r[8], frqS: r[9], frqN: r[10] }])
);
DAILY.forEach((r) => {
  const e = EXCL_KEYS.get(r.day + "|" + D.acc.indexOf(r.acc));
  if (!e) return;
  r.ex = e;
  r.adj = {
    ...r,
    alc: r.alc - e.alc, imp: r.imp - e.imp, led: r.led - e.led, clk: r.clk - e.clk,
    spd: +(r.spd - e.spd).toFixed(2),
    cplS: r.cplS - e.cplS, cplN: r.cplN - e.cplN,
    frqS: r.frqS - e.frqS, frqN: r.frqN - e.frqN,
  };
});

/* The one join the source model gets wrong. `insights list[Proyecto]` carries a
   "Créditos " prefix on 91% of rows, so the M:M relationship to
   `Performance[Nombre de la cuenta]` matches only 33 of 379 reservations.
   Conforming the key here is the whole fix — see the Auditoría page. */
const PROJ_MAP = {
  "Créditos BLV5": "Boulevard5", "Boulevard5": "Boulevard5", "Boulevard 5": "Boulevard5",
  "Créditos Benestare": "Benestare", "Benestare": "Benestare",
  "Créditos BLT": "Bosque Las Tapias", "Bosque Las Tapias": "Bosque Las Tapias",
  "Créditos Casa Elisa": "Casa Elisa", "Casa Elisa": "Casa Elisa",
  "Créditos Santa Elena": "Santa Elena", "Santa Elena": "Santa Elena",
  "Puerta Abierta": "Puerta Abierta",
};
const conform = (p) => (p == null ? null : PROJ_MAP[p] || p);

// res: [dayIdx, proy, fte, fteT, tratoFlag, user, etapa, estado]
const dc = D.dict;
const RES = D.res.map((r) => {
  const dt = r[0] == null ? null : dayToDate(r[0]);
  return {
    day: r[0], dt, ym: dt ? dt.toISOString().slice(0, 7) : null,
    proyRaw: r[1] == null ? null : dc.proy[r[1]],
    proy: conform(r[1] == null ? null : dc.proy[r[1]]),
    fte: (r[2] == null ? "" : dc.fte[r[2]]) || "(sin fuente registrada)",
    fteT: (r[3] == null ? "" : dc.fteT[r[3]]) || null,
    trato: r[4], user: r[5] == null ? "(sin asignar)" : dc.user[r[5]],
    etapa: (r[6] == null ? "" : dc.etapa[r[6]]) || null,
  };
});

/* 58 rows carry Excel serial 0 in `Fecha de reserva`, which Power Query's
   `type date` turned into 1899-12-30 rather than a blank. Treated as missing
   here — see the Auditoría page. */
const SENTINEL_DAY = Math.round((Date.UTC(1899, 11, 30) - EPOCH.getTime()) / 86400000);

// inv: [proy, nivel, num, tipo, m2, hab, precioVenta, estatus, dayIdx]
const INV = D.inv.map((r) => {
  const bad = r[8] != null && r[8] <= SENTINEL_DAY;
  const day = bad ? null : r[8];
  return {
    proy: r[0] == null ? null : dc.iproy[r[0]],
    niv: r[1] == null ? null : dc.niv[r[1]],
    num: r[2], tipo: r[3] == null ? "(sin tipo)" : dc.tipo[r[3]],
    m2: r[4], hab: r[5], pv: r[6] || 0,
    est: r[7] == null ? "(sin estatus)" : dc.est[r[7]],
    badDate: bad, day, dt: day == null ? null : dayToDate(day),
    ym: day == null ? null : dayToDate(day).toISOString().slice(0, 7),
  };
});
const INV_BAD_DATES = INV.filter((r) => r.badDate).length;

// pres: [fecha, mes, proyecto, concepto, proveedor, inversion]
const PRES = D.pres.map((r) => ({
  fecha: r[0], mes: r[1], proyRaw: r[2], proy: conform(r[2]),
  concepto: r[3], prov: r[4], inv: r[5] || 0,
}));

/* The .pbix builds `Calendario` as calendar(min(Performance[Fecha]), TODAY()),
   so it starts 2024-07-05 and cannot see the 4 reservations from Feb–Jun 2024 or
   the unit reservations going back to 2023-07. A date dimension has to span the
   union of every fact table, so that is what this axis does. */
const MONTHS = (() => {
  const ys = [...DAILY, ...RES, ...INV].map((r) => r.ym).filter(Boolean).sort();
  const out = [];
  let [y, m] = ys[0].split("-").map(Number);
  const [ye, me] = ys[ys.length - 1].split("-").map(Number);
  while (y < ye || (y === ye && m <= me)) {
    out.push(y + "-" + String(m).padStart(2, "0"));
    if (++m > 12) { m = 1; y++; }
  }
  return out;
})();
const ACCOUNTS = D.acc.slice();
const ymLabel = (ym) => MONTHS_ES[+ym.slice(5, 7) - 1] + " " + ym.slice(2, 4);

/* ------------------------------------------------------------ formatters -- */

const nf = (n, d = 0) =>
  n == null || !isFinite(n) ? "—" : n.toLocaleString("es-GT", { minimumFractionDigits: d, maximumFractionDigits: d });
const usd = (n, d = 0) => (n == null || !isFinite(n) ? "—" : (n < 0 ? "-$" : "$") + nf(Math.abs(n), d));
const pct = (n, d = 1) => (n == null || !isFinite(n) ? "—" : nf(n * 100, d) + "%");
function compact(n) {
  if (n == null || !isFinite(n)) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K";
  return nf(n);
}
const esc = (s) =>
  String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];
const colorFor = (i) => SERIES[i % SERIES.length];

/* ----------------------------------------------------------------- state -- */

/* The axis reaches back to 2023-07 so the earliest reservations are visible, but
   the default view opens where ad spend actually starts — otherwise page 1 leads
   with a dozen empty months. */
const FIRST_SPEND_M = MONTHS.indexOf(DAILY.map((r) => r.ym).sort()[0]);

const state = {
  page: "resumen",
  m0: Math.max(FIRST_SPEND_M, 0),
  m1: MONTHS.length - 1,
  accs: new Set(ACCOUNTS),
  cmps: new Set(),          // empty = all campaigns
  xf: null,                 // { dim, val, label } cross-filter from a click
  exclCmp: true,            // drop the anomalous campaign, as page 1 of the .pbix does
};

const inMonth = (ym) => ym >= MONTHS[state.m0] && ym <= MONTHS[state.m1];

/** Cross-filter predicate. `skip` lets a visual exclude its own dimension so
    clicking it highlights rather than erases the chart (Power BI's behaviour). */
function xfOk(row, skip) {
  const x = state.xf;
  if (!x || x.dim === skip) return true;
  const v = row[x.dim];
  if (v === undefined) return true;
  return v === x.val;
}

const fDaily = (skip) =>
  DAILY.filter((r) => inMonth(r.ym) && state.accs.has(r.acc) && xfOk(r, skip))
    .map((r) => (state.exclCmp && r.adj ? r.adj : r));

const fCamp = (skip) =>
  CAMP.filter(
    (r) => inMonth(r.ym) && state.accs.has(r.acc) &&
      (state.cmps.size === 0 || state.cmps.has(r.cmp)) &&
      !(state.exclCmp && r.cmp === EXCLUDED_CMP) &&
      xfOk(r, skip)
  );

const fRes = (skip) =>
  RES.filter((r) => r.ym && inMonth(r.ym) && (r.proy == null || state.accs.has(r.proy)) && xfOk(r, skip));

const fInv = (skip) => INV.filter((r) => state.accs.has(r.proy) && xfOk(r, skip));

const fPres = (skip) => PRES.filter((r) => r.proy && state.accs.has(r.proy) && xfOk(r, skip));

const sum = (rows, k) => rows.reduce((a, r) => a + (r[k] || 0), 0);

/** Group rows by a key, returning [{key, rows, ...aggregates}] sorted by `by`. */
function rollup(rows, keyFn, aggFn, sortKey, desc = true) {
  const m = new Map();
  for (const r of rows) {
    const k = keyFn(r);
    if (k == null) continue;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  const out = [...m.entries()].map(([key, rs]) => Object.assign({ key, rows: rs, n: rs.length }, aggFn ? aggFn(rs) : {}));
  if (sortKey) {
    const cmp = (a, b) =>
      typeof a[sortKey] === "string" ? String(a[sortKey]).localeCompare(String(b[sortKey])) : a[sortKey] - b[sortKey];
    out.sort((a, b) => (desc ? -cmp(a, b) : cmp(a, b)));
  }
  return out;
}

const perfAgg = (rs) => ({
  alc: sum(rs, "alc"), imp: sum(rs, "imp"), led: sum(rs, "led"),
  clk: sum(rs, "clk"), spd: sum(rs, "spd"),
  cplS: sum(rs, "cplS"), cplN: sum(rs, "cplN"),
  frqS: sum(rs, "frqS"), frqN: sum(rs, "frqN"),
});
const avgCPL = (a) => (a.cplN ? a.cplS / a.cplN : null);   // row-level AVERAGE, as in the .pbix
const avgFRQ = (a) => (a.frqN ? a.frqS / a.frqN : null);
const cplReal = (a) => (a.led ? a.spd / a.led : null);      // blended: total spend / total leads

/* ------------------------------------------------------------- tooltips --- */

const tip = document.createElement("div");
tip.className = "tip";
document.body.appendChild(tip);

function bindTip(el, html) {
  el.addEventListener("pointerenter", () => {
    tip.innerHTML = html;
    tip.classList.add("on");
  });
  el.addEventListener("pointermove", (e) => {
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    const r = tip.getBoundingClientRect();
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  });
  el.addEventListener("pointerleave", () => tip.classList.remove("on"));
}

/* ---------------------------------------------------------- svg helpers --- */

const NS = "http://www.w3.org/2000/svg";
function E(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function mkSvg(host, w, h) {
  host.innerHTML = "";
  const s = E("svg", { viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: "xMidYMid meet", role: "img" }, host);
  return s;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
function yAxis(g, x0, x1, y0, y1, max, fmt) {
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = (max / steps) * i;
    const y = y1 - ((y1 - y0) * i) / steps;
    E("line", { x1: x0, x2: x1, y1: y, y2: y, class: i ? "gl" : "ax" }, g);
    const t = E("text", { x: x0 - 7, y: y + 3.2, class: "tk", "text-anchor": "end" }, g);
    t.textContent = fmt ? fmt(v) : compact(v);
  }
}

/** Marks a point the way the wordmark marks a star: a small rotated square. */
function node(g, x, y, color, r = 3) {
  E("rect", { x: x - r, y: y - r, width: r * 2, height: r * 2, transform: `rotate(45 ${x} ${y})`, class: "node", stroke: color }, g);
}

/* --------------------------------------------------------------- charts --- */

function chartLine(host, series, opts = {}) {
  const w = 760, h = opts.h || 210;
  const pad = { l: 46, r: 12, t: 10, b: 26 };
  if (!series.length || !series[0].pts.length) return void (host.innerHTML = '<div class="empty">Sin datos en el rango</div>');
  const s = mkSvg(host, w, h);
  const n = series[0].pts.length;
  const max = niceMax(Math.max(...series.flatMap((se) => se.pts.map((p) => p.v))));
  const X = (i) => pad.l + (n === 1 ? (w - pad.l - pad.r) / 2 : ((w - pad.l - pad.r) * i) / (n - 1));
  const Y = (v) => h - pad.b - ((h - pad.b - pad.t) * v) / max;
  yAxis(s, pad.l, w - pad.r, pad.t, h - pad.b, max, opts.fmt);

  const every = Math.max(1, Math.ceil(n / 9));
  series[0].pts.forEach((p, i) => {
    if (i % every && i !== n - 1) return;
    const t = E("text", { x: X(i), y: h - pad.b + 15, class: "tk", "text-anchor": "middle" }, s);
    t.textContent = p.l;
  });

  series.forEach((se) => {
    const d = se.pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
    if (opts.area && series.length === 1) {
      E("path", { d: d + `L${X(n - 1)},${h - pad.b}L${X(0)},${h - pad.b}Z`, fill: se.color, "fill-opacity": ".07", stroke: "none" }, s);
    }
    E("path", { d, fill: "none", stroke: se.color, "stroke-width": 1.6, "stroke-linejoin": "round" }, s);
    if (n <= 40) se.pts.forEach((p, i) => node(s, X(i), Y(p.v), se.color, 2.6));
  });

  series[0].pts.forEach((p, i) => {
    const hit = E("rect", { x: X(i) - (w / n) / 2, y: pad.t, width: w / n, height: h - pad.t - pad.b, class: "hit" }, s);
    bindTip(hit, `<b>${esc(p.l)}</b><br>` + series.map((se) => `${esc(se.name)} ${(opts.fmt || compact)(se.pts[i].v)}`).join("<br>"));
  });
  return s;
}

function chartBarsH(host, rows, opts = {}) {
  if (!rows.length) return void (host.innerHTML = '<div class="empty">Sin datos en el rango</div>');
  const rowH = opts.rowH || 26, padL = opts.padL || 150;
  const w = 640, h = rows.length * rowH + 8;
  const s = mkSvg(host, w, h);
  const max = Math.max(...rows.map((r) => r.v)) || 1;
  rows.forEach((r, i) => {
    const y = i * rowH + 4, bw = ((w - padL - 62) * r.v) / max;
    const g = E("g", { class: state.xf && opts.dim && state.xf.val !== r.key ? "dim" : "" }, s);
    const t = E("text", { x: padL - 9, y: y + rowH / 2 + 1, class: "vl", "text-anchor": "end" }, g);
    t.textContent = r.l.length > 26 ? r.l.slice(0, 25) + "…" : r.l;
    E("rect", { x: padL, y: y + 3, width: Math.max(bw, 1), height: rowH - 10, fill: r.color || "var(--s1)" }, g);
    const vt = E("text", { x: padL + bw + 7, y: y + rowH / 2 + 1, class: "vl" }, g);
    vt.textContent = (opts.fmt || compact)(r.v);
    const hit = E("rect", { x: 0, y, width: w, height: rowH, class: "hit" }, g);
    bindTip(hit, `<b>${esc(r.l)}</b><br>${(opts.fmt || compact)(r.v)}${r.sub ? "<br>" + r.sub : ""}`);
    if (opts.dim) hit.addEventListener("click", () => toggleXF(opts.dim, r.key, r.l));
  });
  return s;
}

function chartBarsV(host, rows, opts = {}) {
  if (!rows.length) return void (host.innerHTML = '<div class="empty">Sin datos en el rango</div>');
  const w = 520, h = opts.h || 210, pad = { l: 44, r: 8, t: 10, b: 34 };
  const s = mkSvg(host, w, h);
  const max = niceMax(Math.max(...rows.map((r) => r.v)));
  const bw = (w - pad.l - pad.r) / rows.length;
  yAxis(s, pad.l, w - pad.r, pad.t, h - pad.b, max, opts.fmt);
  rows.forEach((r, i) => {
    const x = pad.l + i * bw, bh = ((h - pad.t - pad.b) * r.v) / max;
    const g = E("g", { class: state.xf && opts.dim && state.xf.val !== r.key ? "dim" : "" }, s);
    E("rect", { x: x + bw * 0.16, y: h - pad.b - bh, width: bw * 0.68, height: Math.max(bh, 1), fill: r.color || "var(--s1)" }, g);
    const t = E("text", { x: x + bw / 2, y: h - pad.b + 15, class: "tk", "text-anchor": "middle" }, g);
    t.textContent = r.l.length > 9 ? r.l.slice(0, 8) + "…" : r.l;
    const hit = E("rect", { x, y: pad.t, width: bw, height: h - pad.t - pad.b, class: "hit" }, g);
    bindTip(hit, `<b>${esc(r.l)}</b><br>${(opts.fmt || compact)(r.v)}${r.sub ? "<br>" + r.sub : ""}`);
    if (opts.dim) hit.addEventListener("click", () => toggleXF(opts.dim, r.key, r.l));
  });
  return s;
}

function chartDonut(host, rows, opts = {}) {
  if (!rows.length || !rows.some((r) => r.v > 0)) return void (host.innerHTML = '<div class="empty">Sin datos en el rango</div>');
  const w = 340, h = opts.h || 220, cx = 118, cy = h / 2, R = 84, r0 = 50;
  const s = mkSvg(host, w, h);
  const tot = rows.reduce((a, r) => a + r.v, 0);
  let a0 = -Math.PI / 2;
  rows.forEach((r) => {
    const a1 = a0 + (2 * Math.PI * r.v) / tot;
    const big = a1 - a0 > Math.PI ? 1 : 0;
    const p = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)},${(cy + rad * Math.sin(a)).toFixed(2)}`;
    const g = E("g", { class: state.xf && opts.dim && state.xf.val !== r.key ? "dim" : "" }, s);
    const path = E("path", {
      d: `M${p(R, a0)}A${R},${R},0,${big},1,${p(R, a1)}L${p(r0, a1)}A${r0},${r0},0,${big},0,${p(r0, a0)}Z`,
      fill: r.color, stroke: "#fff", "stroke-width": 1.5, cursor: opts.dim ? "pointer" : "default",
    }, g);
    bindTip(path, `<b>${esc(r.l)}</b><br>${(opts.fmt || compact)(r.v)} · ${pct(r.v / tot)}`);
    if (opts.dim) path.addEventListener("click", () => toggleXF(opts.dim, r.key, r.l));
    a0 = a1;
  });
  const c = E("text", { x: cx, y: cy - 3, class: "tk", "text-anchor": "middle", "font-size": "20", fill: "var(--ink)" }, s);
  c.textContent = (opts.fmt || compact)(tot);
  const c2 = E("text", { x: cx, y: cy + 13, class: "tk", "text-anchor": "middle" }, s);
  c2.textContent = opts.centerLabel || "Total";
  rows.forEach((r, i) => {
    E("rect", { x: 228, y: 22 + i * 20, width: 9, height: 9, fill: r.color }, s);
    const t = E("text", { x: 243, y: 30 + i * 20, class: "vl" }, s);
    t.textContent = (r.l.length > 15 ? r.l.slice(0, 14) + "…" : r.l) + "  " + pct(r.v / tot, 0);
  });
  return s;
}

/** Squarified treemap — keeps tiles close to square so small campaigns stay legible. */
function chartTreemap(host, rows, opts = {}) {
  if (!rows.length) return void (host.innerHTML = '<div class="empty">Sin datos en el rango</div>');
  const w = 600, h = opts.h || 300;
  const s = mkSvg(host, w, h);
  const data = rows.filter((r) => r.v > 0).sort((a, b) => b.v - a.v);
  const tot = data.reduce((a, r) => a + r.v, 0);
  const tiles = [];
  let x = 0, y = 0, dw = w, dh = h, i = 0;
  while (i < data.length) {
    const horiz = dw >= dh;
    const side = horiz ? dh : dw;
    let row = [], best = Infinity;
    for (let j = i; j < data.length; j++) {
      const trial = row.concat(data[j]);
      const rs = trial.reduce((a, r) => a + r.v, 0);
      const scale = (horiz ? dw * dh : dw * dh) / (tot - tiles.reduce((a, t) => a + t.v, 0));
      const len = (rs * scale) / side;
      const worst = Math.max(...trial.map((r) => Math.max((r.v * scale) / len / side, side / ((r.v * scale) / len))));
      if (worst > best && row.length) break;
      best = worst; row = trial;
    }
    const rs = row.reduce((a, r) => a + r.v, 0);
    const remain = tot - tiles.reduce((a, t) => a + t.v, 0);
    const len = remain ? ((rs / remain) * (horiz ? dw : dh)) : 0;
    let off = 0;
    row.forEach((r) => {
      const seg = (r.v / rs) * side;
      tiles.push(horiz
        ? { ...r, x, y: y + off, w: len, h: seg }
        : { ...r, x: x + off, y, w: seg, h: len });
      off += seg;
    });
    if (horiz) { x += len; dw -= len; } else { y += len; dh -= len; }
    i += row.length;
  }
  tiles.forEach((t) => {
    const g = E("g", { class: state.xf && opts.dim && state.xf.val !== t.key ? "dim" : "" }, s);
    E("rect", { x: t.x, y: t.y, width: Math.max(t.w - 1.5, 0), height: Math.max(t.h - 1.5, 0), fill: t.color, cursor: opts.dim ? "pointer" : "default" }, g);
    if (t.w > 62 && t.h > 26) {
      const lbl = E("text", { x: t.x + 7, y: t.y + 16, class: "tk", fill: "#fff", "font-size": "9.5" }, g);
      const maxc = Math.floor((t.w - 14) / 5.6);
      lbl.textContent = t.l.length > maxc ? t.l.slice(0, maxc - 1) + "…" : t.l;
      const val = E("text", { x: t.x + 7, y: t.y + 29, class: "tk", fill: "rgba(255,255,255,.72)", "font-size": "10" }, g);
      val.textContent = (opts.fmt || compact)(t.v);
    }
    const hit = E("rect", { x: t.x, y: t.y, width: Math.max(t.w - 1.5, 0), height: Math.max(t.h - 1.5, 0), class: "hit" }, g);
    bindTip(hit, `<b>${esc(t.l)}</b><br>${(opts.fmt || compact)(t.v)} · ${pct(t.v / tot)}${t.sub ? "<br>" + t.sub : ""}`);
    if (opts.dim) hit.addEventListener("click", () => toggleXF(opts.dim, t.key, t.l));
  });
  return s;
}

function chartFunnel(host, rows, opts = {}) {
  if (!rows.length) return void (host.innerHTML = '<div class="empty">Sin datos</div>');
  const w = 520, rowH = 34, h = rows.length * rowH + 6;
  const s = mkSvg(host, w, h);
  const max = Math.max(...rows.map((r) => r.v)) || 1;
  rows.forEach((r, i) => {
    const bw = ((w - 210) * r.v) / max, y = i * rowH + 3;
    const g = E("g", { class: state.xf && opts.dim && state.xf.val !== r.key ? "dim" : "" }, s);
    const t = E("text", { x: 120, y: y + rowH / 2 + 1, class: "vl", "text-anchor": "end" }, g);
    t.textContent = r.l;
    E("rect", { x: 130, y: y + 4, width: Math.max(bw, 1), height: rowH - 12, fill: r.color || "var(--s1)" }, g);
    const vt = E("text", { x: 130 + bw + 8, y: y + rowH / 2 + 1, class: "vl" }, g);
    vt.textContent = nf(r.v) + "  " + pct(r.v / rows.reduce((a, q) => a + q.v, 0), 0);
    const hit = E("rect", { x: 0, y, width: w, height: rowH, class: "hit" }, g);
    bindTip(hit, `<b>${esc(r.l)}</b><br>${nf(r.v)} unidades${r.sub ? "<br>" + r.sub : ""}`);
    if (opts.dim) hit.addEventListener("click", () => toggleXF(opts.dim, r.key, r.l));
  });
  return s;
}

function chartCombo(host, cats, bars, line, opts = {}) {
  if (!cats.length) return void (host.innerHTML = '<div class="empty">Sin datos en el rango</div>');
  const w = 900, h = opts.h || 300, pad = { l: 46, r: 58, t: 12, b: 30 };
  const s = mkSvg(host, w, h);
  const bmax = niceMax(Math.max(...bars, 1)), lmax = niceMax(Math.max(...line, 1));
  const bw = (w - pad.l - pad.r) / cats.length;
  const Y1 = (v) => h - pad.b - ((h - pad.t - pad.b) * v) / bmax;
  const Y2 = (v) => h - pad.b - ((h - pad.t - pad.b) * v) / lmax;
  yAxis(s, pad.l, w - pad.r, pad.t, h - pad.b, bmax, nf);
  for (let i = 0; i <= 4; i++) {
    const v = (lmax / 4) * i;
    const t = E("text", { x: w - pad.r + 7, y: Y2(v) + 3.2, class: "tk" }, s);
    t.textContent = "$" + compact(v);
  }
  cats.forEach((c, i) => {
    const x = pad.l + i * bw;
    E("rect", { x: x + bw * 0.2, y: Y1(bars[i]), width: bw * 0.6, height: Math.max(h - pad.b - Y1(bars[i]), 0), fill: "var(--s2)" }, s);
    if (i % Math.max(1, Math.ceil(cats.length / 12)) === 0 || i === cats.length - 1) {
      const t = E("text", { x: x + bw / 2, y: h - pad.b + 15, class: "tk", "text-anchor": "middle" }, s);
      t.textContent = c;
    }
  });
  const d = line.map((v, i) => `${i ? "L" : "M"}${(pad.l + i * bw + bw / 2).toFixed(1)},${Y2(v).toFixed(1)}`).join("");
  E("path", { d, fill: "none", stroke: "var(--s3)", "stroke-width": 1.8 }, s);
  line.forEach((v, i) => node(s, pad.l + i * bw + bw / 2, Y2(v), "var(--s3)", 2.8));
  cats.forEach((c, i) => {
    const hit = E("rect", { x: pad.l + i * bw, y: pad.t, width: bw, height: h - pad.t - pad.b, class: "hit" }, s);
    const cpr = bars[i] ? line[i] / bars[i] : null;
    bindTip(hit, `<b>${esc(c)}</b><br>Reservas ${nf(bars[i])}<br>Inversión ${usd(line[i])}<br>Costo/reserva ${cpr ? usd(cpr) : "—"}`);
  });
  return s;
}

function renderTable(host, cols, rows, opts = {}) {
  if (!rows.length) return void (host.innerHTML = '<div class="empty">Sin datos en el rango</div>');
  const th = cols.map((c) => `<th class="${c.n ? "n" : ""}">${esc(c.h)}</th>`).join("");
  const plain = (s) => String(s == null ? "" : s).replace(/<[^>]*>/g, "");
  const body = rows.slice(0, opts.limit || 200).map((r, i) => {
    const sel = opts.dim && state.xf && state.xf.val === r.__key;
    const tds = cols.map((c) => {
      const v = c.f(r);
      return `<td class="${c.n ? "n" : ""}" title="${esc(c.raw ? c.raw(r) : plain(v))}">${v}</td>`;
    }).join("");
    return `<tr class="${opts.dim ? "clk" : ""} ${sel ? "sel" : ""}" data-i="${i}">${tds}</tr>`;
  }).join("");
  const foot = opts.total
    ? `<tfoot><tr>${cols.map((c) => `<td class="${c.n ? "n" : ""}">${c.t ? c.t(rows) : ""}</td>`).join("")}</tr></tfoot>`
    : "";
  host.innerHTML = `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
  if (opts.dim) {
    host.querySelectorAll("tbody tr").forEach((tr) => {
      tr.addEventListener("click", () => {
        const r = rows[+tr.dataset.i];
        toggleXF(opts.dim, r.__key, r.__label || r.__key);
      });
    });
  }
}

</script>
<script>
/* ===========================================================================
   Page renderers. Each mirrors one page of the source .pbix; `auditoria` is
   additional and documents what the rebuild found in the model.
   =========================================================================== */

const PAGES = [
  { id: "resumen", label: "Resumen", src: "en vivo — APIs de Orion" },
  { id: "ads", label: "Performance Ads", src: "Performance Ads" },
  { id: "combo", label: "Inversión / Reservas", src: "Performance S" },
  { id: "reservas", label: "Reporte Reservas", src: "Reporte Reservas" },
  { id: "inventario", label: "Inventarios", src: "Integración de Inventarios" },
  { id: "presupuesto", label: "Presupuesto", src: "Presupuesto Mercadeo" },
  { id: "auditoria", label: "Auditoría del modelo", src: "añadida en la reconstrucción" },
];

const el = (h) => {
  const d = document.createElement("div");
  d.innerHTML = h.trim();
  return d.firstElementChild;
};
function card(cls, title, note) {
  const c = el(`<section class="card ${cls}"></section>`);
  if (title) c.appendChild(el(`<h3>${esc(title)}${note ? `<em>${esc(note)}</em>` : ""}</h3>`));
  const body = el('<div class="body"></div>');
  c.appendChild(body);
  return { card: c, body };
}
function kpi(cls, label, value, sub, accent) {
  return el(
    `<section class="card kpi ${cls} ${accent ? "accent" : ""}">
       <div class="k-l">${esc(label)}</div>
       <div class="k-v">${value}</div>
       <div class="k-s">${sub || "&nbsp;"}</div>
       <div class="tick"></div>
     </section>`
  );
}
const grid = () => el('<div class="grid"></div>');

function head(root, title, src) {
  root.appendChild(
    el(`<div class="pagehead"><h1>${esc(title)}</h1><span class="sub">página .pbix: ${esc(src)}</span></div>`)
  );
}

/* ------------------------------------------------------- 1 · Performance -- */

function pageAds(root) {
  head(root, "Performance Ads", "Performance Ads");
  const g = grid();
  root.appendChild(g);

  const rows = fDaily();
  const a = perfAgg(rows);
  const byAcc = rollup(fDaily("acc"), (r) => r.acc, perfAgg, "spd");
  const cmpRows = fCamp();

  g.appendChild(kpi("c3", "Alcance", compact(a.alc), nf(a.alc) + " personas"));
  g.appendChild(kpi("c3", "Inversión en pauta", usd(a.spd), nf(rows.length) + " días·proyecto"));
  g.appendChild(kpi("c3", "Clientes potenciales", nf(a.led), "leads registrados"));
  g.appendChild(
    kpi("c3", "Costo por lead", usd(cplReal(a), 2),
      "mezclado · el .pbix muestra " + usd(avgCPL(a), 2), true)
  );

  const t = card("c6", "Detalle de pauta", "por proyecto");
  g.appendChild(t.card);
  renderTable(t.body,
    [
      { h: "Proyecto", f: (r) => esc(r.key) },
      { h: "Alcance", n: 1, f: (r) => compact(r.alc), t: (rs) => compact(rs.reduce((x, r) => x + r.alc, 0)) },
      { h: "Impres.", n: 1, f: (r) => compact(r.imp), t: (rs) => compact(rs.reduce((x, r) => x + r.imp, 0)) },
      { h: "Leads", n: 1, f: (r) => nf(r.led), t: (rs) => nf(rs.reduce((x, r) => x + r.led, 0)) },
      { h: "Frec.", n: 1, f: (r) => nf(avgFRQ(r), 2) },
      { h: "Inversión", n: 1, f: (r) => usd(r.spd), t: (rs) => usd(rs.reduce((x, r) => x + r.spd, 0)) },
      { h: "CPL", n: 1, f: (r) => usd(cplReal(r), 2), t: (rs) => usd(rs.reduce((x, r) => x + r.spd, 0) / rs.reduce((x, r) => x + r.led, 0), 2) },
    ],
    byAcc.map((r) => ({ ...r, __key: r.key })),
    { dim: "acc", total: true }
  );

  const d = card("c3", "Leads por proyecto");
  g.appendChild(d.card);
  chartDonut(d.body, byAcc.map((r, i) => ({ key: r.key, l: r.key, v: r.led, color: colorFor(i) })),
    { dim: "acc", fmt: nf, centerLabel: "leads" });

  const wd = card("c3", "Leads por día de semana");
  g.appendChild(wd.card);
  const byDow = rollup(fDaily(), (r) => r.dow, perfAgg).sort((x, y) => x.key - y.key);
  chartBarsV(wd.body, byDow.map((r) => ({ key: r.key, l: DOW_ES[r.key].slice(0, 3), v: r.led })), { fmt: nf, h: 200 });

  const inv = card("c6", "Inversión en pauta", "acumulada por proyecto");
  g.appendChild(inv.card);
  chartBarsH(inv.body, byAcc.map((r, i) => ({
    key: r.key, l: r.key, v: r.spd, color: colorFor(i),
    sub: nf(r.led) + " leads · CPL " + usd(cplReal(r), 2),
  })), { dim: "acc", fmt: (v) => usd(v), padL: 138 });

  const cp = card("c6", "Costo por lead", "promedio por proyecto · mezclado");
  g.appendChild(cp.card);
  chartBarsH(cp.body, byAcc.slice().sort((x, y) => (cplReal(y) || 0) - (cplReal(x) || 0))
    .map((r, i) => ({
      key: r.key, l: r.key, v: cplReal(r) || 0, color: colorFor(i),
      sub: usd(r.spd) + " / " + nf(r.led) + " leads",
    })), { dim: "acc", fmt: (v) => usd(v, 2), padL: 138 });

  const tr = card("c6", "Tendencia de inversión", "mensual");
  g.appendChild(tr.card);
  const byMonth = rollup(fDaily(), (r) => r.ym, perfAgg, "key", false);
  chartLine(tr.body, [{ name: "Inversión", color: "var(--s1)", pts: byMonth.map((r) => ({ l: ymLabel(r.key), v: r.spd })) }],
    { area: true, fmt: (v) => usd(v), h: 200 });

  const tc = card("c6", "Tendencia de costo por lead", "mensual · mezclado");
  g.appendChild(tc.card);
  chartLine(tc.body, [{ name: "CPL", color: "var(--s3)", pts: byMonth.map((r) => ({ l: ymLabel(r.key), v: cplReal(r) || 0 })) }],
    { fmt: (v) => usd(v, 2), h: 200 });

  const tm = card("c12", "Campañas", "leads · superior 40 por volumen");
  g.appendChild(tm.card);
  const byCmp = rollup(cmpRows, (r) => r.cmp, (rs) => ({ led: sum(rs, "led"), spd: sum(rs, "spd") }), "led").slice(0, 40);
  chartTreemap(tm.body, byCmp.map((r, i) => ({
    key: r.key, l: r.key, v: r.led, color: colorFor(i),
    sub: usd(r.spd) + " · CPL " + usd(r.led ? r.spd / r.led : null, 2),
  })), { dim: "cmp", fmt: nf, h: 320 });
}

/* --------------------------------------------- 2 · Inversión vs Reservas -- */

function pageCombo(root) {
  head(root, "Inversión en pauta vs. reservas", "Performance S");
  const g = grid();
  root.appendChild(g);

  const months = MONTHS.slice(state.m0, state.m1 + 1);
  const dm = rollup(fDaily(), (r) => r.ym, perfAgg);
  const rm = rollup(fRes(), (r) => r.ym, null);
  const spdBy = Object.fromEntries(dm.map((r) => [r.key, r.spd]));
  const resBy = Object.fromEntries(rm.map((r) => [r.key, r.n]));
  const spend = months.map((m) => spdBy[m] || 0);
  const res = months.map((m) => resBy[m] || 0);
  const totRes = res.reduce((a, b) => a + b, 0), totSpd = spend.reduce((a, b) => a + b, 0);

  g.appendChild(kpi("c3", "Reservas", nf(totRes), "en el rango"));
  g.appendChild(kpi("c3", "Inversión", usd(totSpd), "en el rango"));
  g.appendChild(kpi("c3", "Costo por reserva", usd(totRes ? totSpd / totRes : null), "inversión / reservas", true));
  const withBoth = months.filter((m, i) => res[i] > 0 && spend[i] > 0).length;
  g.appendChild(kpi("c3", "Meses con ambos", nf(withBoth) + " / " + nf(months.length), "cobertura del cruce"));

  const c = card("c12", "Inversión en pauta vs. reservas mensuales", "barras: reservas · línea: inversión");
  g.appendChild(c.card);
  chartCombo(c.body, months.map(ymLabel), res, spend, { h: 320 });
  c.card.appendChild(el(
    `<div class="legend"><span><i style="background:var(--s2)"></i>Reservas (conteo de tratos)</span>
     <span><i style="background:var(--s3)"></i>Inversión en pauta (USD)</span></div>`
  ));

  const t = card("c12", "Detalle mensual");
  g.appendChild(t.card);
  const rows = months.map((m, i) => ({
    __key: m, m, res: res[i], spd: spend[i],
    cpr: res[i] ? spend[i] / res[i] : null,
    led: (dm.find((x) => x.key === m) || {}).led || 0,
  })).reverse();
  renderTable(t.body, [
    { h: "Mes", f: (r) => ymLabel(r.m) },
    { h: "Inversión", n: 1, f: (r) => usd(r.spd), t: (rs) => usd(rs.reduce((a, r) => a + r.spd, 0)) },
    { h: "Leads", n: 1, f: (r) => nf(r.led), t: (rs) => nf(rs.reduce((a, r) => a + r.led, 0)) },
    { h: "Reservas", n: 1, f: (r) => nf(r.res), t: (rs) => nf(rs.reduce((a, r) => a + r.res, 0)) },
    { h: "Lead→reserva", n: 1, f: (r) => (r.led ? pct(r.res / r.led, 2) : "—") },
    { h: "Costo/reserva", n: 1, f: (r) => usd(r.cpr) },
  ], rows, { total: true, limit: 40 });
}

/* ---------------------------------------------------- 3 · Reporte Reservas */

function pageReservas(root) {
  head(root, "Reporte de reservas", "Reporte Reservas");
  const g = grid();
  root.appendChild(g);

  const rows = fRes();
  const months = MONTHS.slice(state.m0, state.m1 + 1);
  const byMonth = rollup(rows, (r) => r.ym, null, "key", false);
  const last = byMonth[byMonth.length - 1], prev = byMonth[byMonth.length - 2];
  const varMoM = prev && prev.n ? last.n / prev.n - 1 : null;
  const spd = sum(fDaily(), "spd");

  g.appendChild(kpi("c3", "Reservas", nf(rows.length), "tratos en el rango"));
  g.appendChild(kpi("c3", "Costo por cierre", usd(rows.length ? spd / rows.length : null), "inversión / reservas", true));
  g.appendChild(kpi("c3", last ? "Reservas · " + ymLabel(last.key) : "Último mes", last ? nf(last.n) : "—",
    prev ? "mes anterior " + nf(prev.n) : "sin mes previo"));
  g.appendChild(kpi("c3", "Variación mensual", varMoM == null ? "—" : (varMoM >= 0 ? "+" : "") + pct(varMoM, 1),
    prev ? ymLabel(prev.key) + " → " + ymLabel(last.key) : "&nbsp;"));

  const f = card("c6", "Reservas por fuente");
  g.appendChild(f.card);
  const byFte = rollup(fRes("fte"), (r) => r.fte, null, "n");
  chartBarsH(f.body, byFte.map((r, i) => ({ key: r.key, l: r.key, v: r.n, color: colorFor(i) })),
    { dim: "fte", fmt: nf, padL: 168 });

  const p = card("c6", "Reservas por proyecto", "clave conformada");
  g.appendChild(p.card);
  const byProy = rollup(fRes("proy"), (r) => r.proy, null, "n");
  chartBarsH(p.body, byProy.map((r, i) => ({
    key: r.key, l: r.key, v: r.n, color: colorFor(i),
    sub: "origen: " + [...new Set(r.rows.map((x) => x.proyRaw))].join(", "),
  })), { dim: "proy", fmt: nf, padL: 168 });

  const tr = card("c6", "Reservas por mes");
  g.appendChild(tr.card);
  chartLine(tr.body, [{
    name: "Reservas", color: "var(--s1)",
    pts: months.map((m) => ({ l: ymLabel(m), v: (byMonth.find((x) => x.key === m) || { n: 0 }).n })),
  }], { area: true, fmt: nf, h: 200 });

  const u = card("c6", "Reservas por asesor");
  g.appendChild(u.card);
  const byUser = rollup(fRes("user"), (r) => r.user, null, "n").slice(0, 8);
  chartBarsH(u.body, byUser.map((r, i) => ({ key: r.key, l: r.key, v: r.n, color: colorFor(i) })),
    { dim: "user", fmt: nf, padL: 168 });

  const t = card("c12", "Reservas por fuente", "la inversión no está atribuida por fuente en el modelo; el reparto es proporcional");
  g.appendChild(t.card);
  const tot = rows.length || 1;
  renderTable(t.body, [
    { h: "Fuente", f: (r) => esc(r.key) },
    { h: "Reservas", n: 1, f: (r) => nf(r.n), t: (rs) => nf(rs.reduce((a, r) => a + r.n, 0)) },
    { h: "Participación", n: 1, f: (r) => pct(r.n / tot) },
    { h: "Inversión asignada", n: 1, f: (r) => usd((spd * r.n) / tot), t: () => usd(spd) },
  ], byFte.map((r) => ({ ...r, __key: r.key })), { dim: "fte", total: true });
}

/* ------------------------------------------------------- 5 · Presupuesto -- */

function pagePresupuesto(root) {
  head(root, "Presupuesto de mercadeo", "Presupuesto Mercadeo");
  const g = grid();
  root.appendChild(g);

  const rows = fPres();
  const plan = sum(rows, "inv");
  // Budget rows only exist for nov-2025 onward; compare like with like.
  const budgetMonths = ["2025-11", "2025-12", "2026-01", "2026-02"];
  const actual = sum(DAILY.filter((r) => budgetMonths.includes(r.ym) && state.accs.has(r.acc)), "spd");

  g.appendChild(kpi("c3", "Presupuesto cargado", usd(plan), nf(rows.length) + " líneas"));
  g.appendChild(kpi("c3", "Meses presupuestados", "4", "nov 25 – feb 26"));
  g.appendChild(kpi("c3", "Gasto real (mismos meses)", usd(actual), "de la base de performance", true));
  g.appendChild(kpi("c3", "Diferencia", usd(actual - plan),
    plan ? (actual >= plan ? "+" : "") + pct(actual / plan - 1, 1) + " vs. plan" : "&nbsp;"));

  const p = card("c6", "Presupuesto por proyecto");
  g.appendChild(p.card);
  const byProy = rollup(fPres("proy"), (r) => r.proy, (rs) => ({ inv: sum(rs, "inv") }), "inv");
  chartBarsH(p.body, byProy.map((r, i) => ({ key: r.key, l: r.key, v: r.inv, color: colorFor(i) })),
    { dim: "proy", fmt: (v) => usd(v), padL: 138 });

  const c = card("c6", "Presupuesto por concepto");
  g.appendChild(c.card);
  const byCon = rollup(rows, (r) => r.concepto, (rs) => ({ inv: sum(rs, "inv") }), "inv");
  chartBarsH(c.body, byCon.map((r, i) => ({ key: r.key, l: r.key, v: r.inv, color: colorFor(i) })),
    { fmt: (v) => usd(v), padL: 138 });

  const t = card("c12", "Líneas de presupuesto");
  g.appendChild(t.card);
  renderTable(t.body, [
    { h: "Fecha (origen)", f: (r) => `<span style="${/31\/11/.test(r.fecha || "") ? "color:var(--neg);font-weight:700" : ""}">${esc(r.fecha)}</span>`, raw: (r) => r.fecha },
    { h: "Mes", f: (r) => esc(r.mes) },
    { h: "Proyecto (origen)", f: (r) => esc(r.proyRaw) },
    { h: "Conformado", f: (r) => esc(r.proy) },
    { h: "Concepto", f: (r) => esc(r.concepto) },
    { h: "Proveedor", f: (r) => esc(r.prov) },
    { h: "Inversión", n: 1, f: (r) => usd(r.inv, 2), t: (rs) => usd(rs.reduce((a, r) => a + r.inv, 0), 2) },
  ], rows, { total: true, limit: 60 });
}

function pageAuditoria(root) {
  head(root, "Auditoría del modelo", "añadida en la reconstrucción");
  const g = grid();
  root.appendChild(g);

  const crit = FINDINGS.filter((f) => f.sev === 1).length;
  g.appendChild(kpi("c3", "Hallazgos críticos", nf(crit),
    nf(FINDINGS.length) + " hallazgos en total"));
  g.appendChild(kpi("c3", "Relaciones en el modelo", "1", "para 4 tablas de hechos", true));
  g.appendChild(kpi("c3", "Reservas fuera del cruce", nf(RES.filter((r) => !ACCOUNTS.includes(r.proyRaw)).length) + " / " + nf(RES.length),
    "por el prefijo «Créditos»"));
  g.appendChild(kpi("c3", "Fechas centinela", nf(INV_BAD_DATES), "unidades con 30/12/1899"));

  const c = card("c12", "Hallazgos", "ordenados por severidad");
  g.appendChild(c.card);
  const SEV = { 1: "Crítico · cifra publicada incorrecta", 2: "Alto · distorsiona la lectura", 3: "Medio · higiene" };

  g.appendChild(m.card);
  const MEAS = [
    ["Med Importe Gastado", "SUM('Performance - Data Base PA'[Importe gastado (USD)])", "ok"],
    ["Med Recuento Fuente", "COUNT('insights list'[Fuente - Trato])", "ok"],
    ["Med Recuento Trato", "COUNT('insights list'[Trato])", "ok"],
    ["Costo por Cierre", "DIVIDE([Med Importe Gastado],[Med Recuento Fuente])", "cruza la relación M:M rota"],
    ["Reservas Mes Anterior", "CALCULATE(CALCULATE([Med Recuento Trato],DATEADD(FILTER(DATESMTD(Calendario[Date]),Calendario[Date] <= TODAY()),-1,MONTH),Calendario[Date] <= TODAY()))", "Calendario sin relación"],
    ["% Variación Mensual", "DIVIDE([Med Recuento Trato],[Reservas Mes Anterior])-1", "hereda el error anterior"],

    { h: "Estado", f: (r) => `<span style="color:${r[2] === "ok" ? "var(--pos)" : "var(--neg)"}">${esc(r[2])}</span>` },

}

/* ------------------------------------------------- page: resumen (live) ---
   Added by Orion (2026-08-12), NOT part of the .pbix reconstruction. Fetches
   the app's live APIs same-origin (auth cookies flow): /api/mercadeo/funnel,
   /api/mercadeo/leads-metas, /api/mercadeo/roas. The month/project slicers of
   the snapshot pages do NOT apply here. Keep this block when refreshing the
   snapshot data. */

let RESUMEN = { status: "idle", funnel: null, metas: null, roas: null, error: null };

function loadResumen() {
  if (RESUMEN.status === "loading" || RESUMEN.status === "ok") return;
  RESUMEN.status = "loading";
  const j = async (r) => {
    if (!r.ok) {
      const b = await r.json().catch(() => null);
      throw new Error((b && b.error) || "HTTP " + r.status);
    }
    return r.json();
  };
  Promise.all([
    fetch("/api/mercadeo/funnel").then(j),
    fetch("/api/mercadeo/leads-metas").then(j),
    fetch("/api/mercadeo/roas").then(j),
  ])
    .then(([funnel, metas, roas]) => {
      RESUMEN = { status: "ok", funnel, metas, roas, error: null };
      if (state.page === "resumen") render();
    })
    .catch((e) => {
      RESUMEN = { status: "error", funnel: null, metas: null, roas: null, error: e.message };
      if (state.page === "resumen") render();
    });
}

const METAS_STATUS = {
  debajo: { label: "Debajo del rango", color: "var(--neg)" },
  dentro: { label: "Dentro del rango", color: "var(--pos)" },
  encima: { label: "Encima del rango", color: "var(--brass)" },
  sin_meta: { label: "Sin meta", color: "var(--ink-4)" },
};

function pageResumen(root) {
  head(root, "Resumen", "en vivo — APIs de Orion");
  loadResumen();

  if (RESUMEN.status !== "ok" && RESUMEN.status !== "error") {
    root.appendChild(el('<p style="color:var(--ink-3);font-size:13px">Cargando datos en vivo…</p>'));
    return;
  }
  if (RESUMEN.status === "error") {
    root.appendChild(
      el(`<p style="color:var(--neg);font-size:13px">No se pudo cargar el resumen: ${esc(RESUMEN.error)}</p>`)
    );
    RESUMEN.status = "idle"; // retry on next visit
    return;
  }

  const gtq = (n) => (n == null || !isFinite(n) ? "—" : "Q " + nf(Math.round(n)));
  const xx = (n) => (n == null || !isFinite(n) ? "—" : (n >= 100 ? nf(Math.round(n)) : n.toFixed(1)) + "x");
  const pctf = (n) => (n >= 10 ? Math.round(n) : n.toFixed(n >= 1 ? 1 : 2)) + "%";

  const g = grid();
  root.appendChild(g);

  g.appendChild(
    el(
      `<p class="c12" style="color:var(--ink-3);font-size:12px;margin:0">
         Data en vivo de Orion (reservas, PCV y ventas desde la base; leads y gasto desde los snapshots).
         Los filtros de rango de meses y proyecto de arriba no aplican a esta página.</p>`
    )
  );

  // --- Funnel de conversión ---
  const f = RESUMEN.funnel;
  g.appendChild(kpi("c4", "Leads (pauta Meta)", nf(f.leads), "snapshot, excluye campaña con columna mal mapeada"));
  g.appendChild(kpi("c4", "Reservas", nf(f.reservas), "→ " + pctf(f.tasaLeadReserva) + " de leads", true));
  g.appendChild(kpi("c4", "PCV firmadas", nf(f.pcvFirmadas), "→ " + pctf(f.tasaReservaPcv) + " de reservas", true));
  g.appendChild(
    el(
      `<p class="c12" style="color:var(--ink-3);font-size:12px;margin:0">
         Funnel de conversión — período ${esc(f.period.from)} → ${esc(f.period.to)}.
         Reservas y PCV = todas las fuentes, desde la base de datos.</p>`
    )
  );

  // --- Metas de leads ---
  const m = RESUMEN.metas;
  const mt = card("c12", "Metas de leads", m.month);
  g.appendChild(mt.card);
  renderTable(
    mt.body,
    [
      { h: "Proyecto", f: (r) => `<b>${esc(r.project)}</b>` },
      { h: "Leads (mes)", n: 1, f: (r) => nf(r.leads) },
      { h: "Rango mensual", n: 1, f: (r) => (r.min != null && r.max != null ? nf(r.min) + "–" + nf(r.max) : "—") },
      { h: "≈/día", n: 1, f: (r) => nf(Math.round(r.leadsPorDia)) },
      {
        h: "Meta ≈/día",
        n: 1,
        f: (r) =>
          r.minPorDia != null && r.maxPorDia != null
            ? nf(Math.round(r.minPorDia)) + "–" + nf(Math.round(r.maxPorDia))
            : "—",
      },
      {
        h: "Estado",
        f: (r) => {
          const s = METAS_STATUS[r.status] || METAS_STATUS.sin_meta;
          return `<span style="color:${s.color};font-weight:600">${esc(s.label)}</span>`;
        },
      },
    ],
    m.proyectos
  );
  mt.body.appendChild(
    el(
      `<p style="color:var(--ink-3);font-size:12px;margin:8px 0 0">
         Rangos mensuales "saludables" del equipo de mercadeo (2026-08-07). Leads del último mes
         completo del snapshot, netos de la campaña excluida por auditoría.</p>`
    )
  );

  // --- ROAS / ROI ---
  const r = RESUMEN.roas;
  g.appendChild(kpi("c3", "Inversión en pauta", gtq(r.global.spendGtq), "todas las cuentas, en GTQ"));
  g.appendChild(kpi("c3", "Ventas (revenue)", gtq(r.global.revenueGtq), "ventas no canceladas"));
  g.appendChild(kpi("c3", "ROAS amplio", xx(r.global.roasAmplio), "todas las ventas", true));
  g.appendChild(kpi("c3", "ROAS atribuido", xx(r.global.roasAtribuido), "fuentes digitales", true));

  const rt = card("c12", "ROAS / ROI por proyecto", "gasto en divisa real");
  g.appendChild(rt.card);
  renderTable(
    rt.body,
    [
      {
        h: "Proyecto",
        f: (p) => `<b>${esc(p.project)}</b>` + (p.flag ? ` <span title="${esc(p.flag)}" style="color:var(--brass)">⚠</span>` : ""),
      },
      {
        h: "Inversión",
        n: 1,
        f: (p) =>
          p.spendCurrency === "USD"
            ? usd(p.spendNative) + ` <span style="color:var(--ink-4)">(${gtq(p.spendGtq)})</span>`
            : gtq(p.spendNative),
      },
      {
        h: "Ventas (#)",
        n: 1,
        f: (p) => nf(p.ventas) + (p.ventasAtribuidas > 0 ? ` <span style="color:var(--ink-4)">(${nf(p.ventasAtribuidas)} dig.)</span>` : ""),
      },
      { h: "Revenue", n: 1, f: (p) => gtq(p.revenueGtq) },
      { h: "ROAS amplio", n: 1, f: (p) => xx(p.roasAmplio) },
      { h: "ROAS atribuido", n: 1, f: (p) => xx(p.roasAtribuido) },
    ],
    r.proyectos
  );
  rt.body.appendChild(
    el(
      `<p style="color:var(--ink-3);font-size:12px;margin:8px 0 0">
         Período ${esc(r.period.from)} → ${esc(r.period.to)}. Gasto por cuenta en su divisa real
         (columna Divisa del export — el reporte Power BI mezcla GTQ y USD). Conversión fija
         Q${esc(String(r.gtqPerUsd))}/USD. Revenue = ventas no canceladas (sales). Atribuido =
         unidades cuya reserva tiene fuente digital.</p>`
    )
  );
}

const RENDER = {
  resumen: pageResumen,
  ads: pageAds, combo: pageCombo, reservas: pageReservas,
  inventario: pageInventario, presupuesto: pagePresupuesto, auditoria: pageAuditoria,
};

</script>
<script>
/* ===========================================================================
   Shell: navigation, slicers, cross-filter wiring.
   =========================================================================== */

/* ------------------------------------------------------------------- ui --- */

function toggleXF(dim, val, label) {
  state.xf = state.xf && state.xf.dim === dim && state.xf.val === val ? null : { dim, val, label };
  render();
}
window.toggleXF = toggleXF;

function buildRail() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  PAGES.forEach((p, i) => {
    const b = el(
      `<button type="button" class="${state.page === p.id ? "on" : ""}" data-p="${p.id}">
         <span class="idx mono">${String(i + 1).padStart(2, "0")}</span>${esc(p.label)}
       </button>`
    );
    b.addEventListener("click", () => {
      state.page = p.id;
      state.xf = null;
      render();
      document.querySelector(".main").scrollIntoView({ block: "start", behavior: "auto" });
    });
    nav.appendChild(b);
  });
}

function buildTopbar() {
  const bar = document.getElementById("topbar");
  bar.innerHTML = "";

  // month range
  const rng = el(
    `<div class="ctl"><label>Rango de meses</label>
       <div class="range">
         <input type="range" id="m0" min="0" max="${MONTHS.length - 1}" value="${state.m0}" aria-label="Mes inicial">
         <span class="rv" id="rv">${ymLabel(MONTHS[state.m0])} – ${ymLabel(MONTHS[state.m1])}</span>
         <input type="range" id="m1" min="0" max="${MONTHS.length - 1}" value="${state.m1}" aria-label="Mes final">
       </div>
     </div>`
  );
  bar.appendChild(rng);
  const r0 = rng.querySelector("#m0"), r1 = rng.querySelector("#m1");
  const sync = () => {
    state.m0 = Math.min(+r0.value, +r1.value);
    state.m1 = Math.max(+r0.value, +r1.value);
    rng.querySelector("#rv").textContent = ymLabel(MONTHS[state.m0]) + " – " + ymLabel(MONTHS[state.m1]);
    render(true);
  };
  r0.addEventListener("input", sync);
  r1.addEventListener("input", sync);

  // projects
  const pj = el('<div class="ctl"><label>Proyecto</label><div class="chips"></div></div>');
  const chips = pj.querySelector(".chips");
  ACCOUNTS.forEach((a) => {
    const c = el(`<button type="button" class="chip ${state.accs.has(a) ? "on" : ""}">${esc(a)}</button>`);
    c.addEventListener("click", () => {
      state.accs.has(a) ? state.accs.delete(a) : state.accs.add(a);
      if (!state.accs.size) ACCOUNTS.forEach((x) => state.accs.add(x));
      render();
    });
    chips.appendChild(c);
  });
  const all = el('<button type="button" class="chip">todos</button>');
  all.addEventListener("click", () => {
    ACCOUNTS.forEach((x) => state.accs.add(x));
    render();
  });
  chips.appendChild(all);
  bar.appendChild(pj);

  // campaign picker
  const cmpSel = el(
    `<div class="ctl"><label>Campaña</label>
       <select id="cmp"><option value="">todas (${D.cmp.length})</option></select></div>`
  );
  const sel = cmpSel.querySelector("select");
  D.cmp.forEach((c) => {
    const o = document.createElement("option");
    o.value = c;
    o.textContent = c.length > 44 ? c.slice(0, 43) + "…" : c;
    if (state.cmps.has(c)) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => {
    state.cmps = sel.value ? new Set([sel.value]) : new Set();
    render();
  });
  bar.appendChild(cmpSel);

  /* data-quality exclusion — control hidden for now (Jorge 2026-08-12); the
     exclusion itself stays active via state.exclCmp = true.
  const ex = el('<div class="ctl"><label>Calidad de datos</label><div class="chips"></div></div>');
  const exc = el(`<button type="button" class="chip brass ${state.exclCmp ? "on" : ""}">excluir campaña anómala</button>`);
  exc.title = EXCLUDED_CMP + " — 104.290 leads contra $323 de inversión";
  exc.addEventListener("click", () => {
    state.exclCmp = !state.exclCmp;
    render();
  });
  ex.querySelector(".chips").appendChild(exc);
  bar.appendChild(ex);
  */
}

function renderXFBar() {
  const b = document.getElementById("xfbar");
  if (!state.xf) return void b.classList.remove("on");
  b.classList.add("on");
  b.innerHTML = `<span>Filtro cruzado:</span><b>${esc(state.xf.label)}</b>`;
  const btn = el("<button type=button>quitar</button>");
  btn.addEventListener("click", () => {
    state.xf = null;
    render();
  });
  b.appendChild(btn);
}

/* -------------------------------------------------------------- render ---- */

let raf = 0;
function render(defer) {
  if (defer) {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => render());
    return;
  }
  buildRail();
  renderXFBar();
  const root = document.getElementById("page");
  root.innerHTML = "";
  RENDER[state.page](root);
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.p === state.page));
}

buildTopbar();
render();

</script>
</body>
